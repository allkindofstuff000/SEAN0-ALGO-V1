function XauSignalLogPanel() {
  const [entries, setEntries] = useState([]);
  const [filter,  setFilter]  = useState('all'); // all | signal | nosignal

  useEffect(() => {
    let cancelled = false;
    const poll = async () => {
      try {
        const r = await fetch('/api/xau-scalp/log?limit=200');
        if (!r.ok || cancelled) return;
        const d = await r.json();
        setEntries(d.log || []);
      } catch {}
    };
    poll();
    const id = setInterval(poll, 5000);
    return () => { cancelled = true; clearInterval(id); };
  }, []);

  const COND_LABELS = ['T', 'Z', 'S', 'R', 'V'];
  const COND_KEYS   = ['uptrend', 'demandZone', 'liquiditySweep', 'rejection', 'volume'];
  const COND_TIPS   = ['Uptrend', 'Demand Zone', 'Liq. Sweep', 'Rejection', 'Volume Spike'];

  const filtered = entries.filter(e =>
    filter === 'all' ? true :
    filter === 'signal' ? e.decision === 'SIGNAL' :
    e.decision !== 'SIGNAL'
  );

  return (
    <div className="card">
      <div className="card-hd">
        <span className="card-title">Decision Log · XAU SCALP</span>
        <div style={{ display: 'flex', gap: 6 }}>
          {[['all','All'],['signal','Signals Only'],['nosignal','No Signal']].map(([v, l]) => (
            <button key={v} className={`btn btn-ghost btn-sm${filter===v?' active':''}`}
              style={filter===v?{borderColor:'var(--accent)',color:'var(--accent)'}:{}}
              onClick={() => setFilter(v)}>{l}</button>
          ))}
        </div>
      </div>

      {/* Legend */}
      <div style={{ display: 'flex', gap: 16, padding: '8px 16px', borderBottom: '1px solid var(--border)', fontSize: 11, color: 'var(--muted)' }}>
        {COND_KEYS.map((k, i) => (
          <span key={k} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <span className="xau-log-dot on" />
            {COND_TIPS[i]} ({COND_LABELS[i]})
          </span>
        ))}
      </div>

      <div className="xau-log-wrap">
        {filtered.length === 0 && (
          <div style={{ color: 'var(--muted)', textAlign: 'center', padding: '32px 0' }}>
            {entries.length === 0 ? 'Waiting for first M1 candle close…' : 'No entries match filter'}
          </div>
        )}
        {filtered.map((e, i) => {
          const isSignal = e.decision === 'SIGNAL';
          const conds    = e.conditions || {};
          return (
            <div key={i} className={`xau-log-entry${isSignal ? ' signal' : ''}`}>
              <span className="xau-log-ts">{e.candleTime || '—'}</span>
              <span className="xau-log-price">{e.price?.toFixed(2)}</span>
              <span className="xau-log-conds" title={COND_TIPS.join(' | ')}>
                {COND_KEYS.map((k, ci) => (
                  <span key={k} className={`xau-log-dot ${conds[k] ? 'on' : 'off'}`} title={COND_TIPS[ci]} />
                ))}
              </span>
              <span className="xau-log-score">{e.score ?? 0}/5</span>
              <span className={`xau-log-decision ${isSignal ? 'signal' : 'no'}`}>
                {isSignal ? `⚡ ${e.strength}` : '— no signal'}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}


function XauScalpWorkspace() {
  const [conditions,    setConditions]    = useState({});
  const [latestSignal,  setLatestSignal]  = useState(null);
  const [signalHistory, setSignalHistory] = useState([]);
  const [stats,         setStats]         = useState({});
  const [livePrice,     setLivePrice]     = useState(null);
  const [openPrice,     setOpenPrice]     = useState(null);
  const [activeTab,     setActiveTab]     = useState(() => {
    try { return localStorage.getItem('strategy:xau-scalp:tab') || 'signals'; } catch { return 'signals'; }
  });

  const mainChartRef  = useRef(null);
  const mainSeriesRef = useRef(null);
  const volChartRef   = useRef(null);
  const volSeriesRef  = useRef(null);
  const priceLinesRef = useRef({});
  const chartContRef  = useRef(null);
  const volContRef    = useRef(null);
  const chartInited   = useRef(false);

  const setTab = (t) => {
    setActiveTab(t);
    try { localStorage.setItem('strategy:xau-scalp:tab', t); } catch {}
  };

  // ── Draw signal price lines ──────────────────────────────────────────────
  function drawSignalLines(sig, series) {
    if (!series) return;
    const pl = priceLinesRef.current;
    Object.values(pl).forEach(ref => { try { series.removePriceLine(ref); } catch {} });
    priceLinesRef.current = {};
    if (!sig) return;
    const LS = window.LightweightCharts.LineStyle;
    priceLinesRef.current.entry = series.createPriceLine({ price: sig.entryPrice,  color: '#26a69a', lineWidth: 1, lineStyle: LS.Dashed, title: 'ENTRY' });
    priceLinesRef.current.sl    = series.createPriceLine({ price: sig.stopLoss,    color: '#ef5350', lineWidth: 1, lineStyle: LS.Dashed, title: 'SL'    });
    priceLinesRef.current.tp    = series.createPriceLine({ price: sig.takeProfit,  color: '#f0b429', lineWidth: 1, lineStyle: LS.Dashed, title: 'TP'    });
    priceLinesRef.current.be    = series.createPriceLine({ price: sig.breakEvenAt, color: '#b2b5be', lineWidth: 1, lineStyle: LS.Dotted, title: 'BE'    });
  }

  // ── Init chart on first visit to chart tab ───────────────────────────────
  useEffect(() => {
    if (activeTab !== 'chart') return;
    if (chartInited.current) return;
    chartInited.current = true;

    const LC = window.LightweightCharts;
    if (!LC || !chartContRef.current) return;

    const baseOpts = {
      layout:     { background: { color: '#131722' }, textColor: '#8b949e' },
      grid:       { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
      rightPriceScale: { borderColor: '#1e222d' },
      timeScale:  { borderColor: '#1e222d', timeVisible: true, secondsVisible: false },
      crosshair:  { mode: 1 },
      handleScroll: { mouseWheel: true, pressedMouseMove: true },
      handleScale:  { mouseWheel: true, pinch: true },
    };

    const chart  = LC.createChart(chartContRef.current, { ...baseOpts, height: 380 });
    const series = chart.addCandlestickSeries({
      upColor: '#26a69a', downColor: '#ef5350',
      borderUpColor: '#26a69a', borderDownColor: '#ef5350',
      wickUpColor:   '#26a69a', wickDownColor:   '#ef5350',
    });
    mainChartRef.current  = chart;
    mainSeriesRef.current = series;

    if (volContRef.current) {
      const vChart  = LC.createChart(volContRef.current, { ...baseOpts, height: 80, rightPriceScale: { visible: false }, timeScale: { visible: false } });
      const vSeries = vChart.addHistogramSeries({ priceScaleId: 'vol', color: '#26a69a', priceFormat: { type: 'volume' } });
      volChartRef.current  = vChart;
      volSeriesRef.current = vSeries;
      chart.timeScale().subscribeVisibleLogicalRangeChange(lr => {
        if (lr) vChart.timeScale().setVisibleLogicalRange(lr);
      });
    }

    // Load historical candles
    fetch('/api/candles/M1').then(r => r.json()).then(d => {
      const raw     = d.candles || d;
      const candles = raw.map(c => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close }));
      if (candles.length) {
        series.setData(candles);
        chart.timeScale().fitContent();
        setOpenPrice(p => p ?? candles[0].open);
      }
      if (volSeriesRef.current) {
        const vols = raw.map(c => ({ time: c.time, value: c.volume || 0, color: c.close >= c.open ? 'rgba(38,166,154,.6)' : 'rgba(239,83,80,.5)' }));
        volSeriesRef.current.setData(vols);
      }
      // Redraw any active signal lines
      if (latestSignal) drawSignalLines(latestSignal, series);
    }).catch(() => {});
  }, [activeTab]);

  // ── Poll /api/xau-scalp/status every 3s ─────────────────────────────────
  useEffect(() => {
    let cancelled = false;
    const poll = async () => {
      try {
        const r = await fetch('/api/xau-scalp/status');
        if (!r.ok || cancelled) return;
        const d = await r.json();
        setConditions(d.conditions || {});
        setLatestSignal(d.latestSignal || null);
        setStats(d.stats || {});
        if (d.livePrice?.price) {
          setLivePrice(d.livePrice.price);
          setOpenPrice(p => p ?? d.livePrice.price);
        }
        if (d.latestSignal && mainSeriesRef.current) {
          drawSignalLines(d.latestSignal, mainSeriesRef.current);
        }
      } catch {}
    };
    poll();
    const id = setInterval(poll, 3000);
    return () => { cancelled = true; clearInterval(id); };
  }, []);

  // ── Poll signal history every 10s ───────────────────────────────────────
  useEffect(() => {
    let cancelled = false;
    const poll = async () => {
      try {
        const r = await fetch('/api/xau-scalp/signals/history?limit=20');
        if (!r.ok || cancelled) return;
        const d = await r.json();
        setSignalHistory(d.signals || d || []);
      } catch {}
    };
    poll();
    const id = setInterval(poll, 10000);
    return () => { cancelled = true; clearInterval(id); };
  }, []);

  // ── SSE live ticks/candles ───────────────────────────────────────────────
  useEffect(() => {
    let es = null, reconnTimer = null;
    const connect = () => {
      es = new EventSource('/api/stream/M1');
      es.onmessage = evt => {
        try {
          const ev = JSON.parse(evt.data);
          if (ev.type === 'tick') {
            if (ev.price) {
              setLivePrice(ev.price);
              setOpenPrice(p => p ?? ev.price);
            }
            const m1 = ev.candles && ev.candles.M1;
            if (m1 && mainSeriesRef.current) {
              mainSeriesRef.current.update({ time: m1.time, open: m1.open, high: m1.high, low: m1.low, close: m1.close });
              if (volSeriesRef.current && m1.volume !== undefined)
                volSeriesRef.current.update({ time: m1.time, value: m1.volume, color: m1.close >= m1.open ? 'rgba(38,166,154,.6)' : 'rgba(239,83,80,.5)' });
            }
          } else if (ev.type === 'candle' && ev.timeframe === 'M1') {
            const c = ev.candle;
            if (c && mainSeriesRef.current)
              mainSeriesRef.current.update({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close });
          }
        } catch {}
      };
      es.onerror = () => { es.close(); reconnTimer = setTimeout(connect, 5000); };
    };
    connect();
    return () => { if (reconnTimer) clearTimeout(reconnTimer); if (es) es.close(); };
  }, []);

  // ── Derived display values ───────────────────────────────────────────────
  const chgAmt  = livePrice && openPrice ? livePrice - openPrice : 0;
  const chgPct  = openPrice ? (chgAmt / openPrice * 100).toFixed(2) : '0.00';
  const chgSign = chgAmt >= 0 ? '+' : '';

  const ut = conditions.uptrend         || {};
  const dz = conditions.demandZone      || {};
  const lq = conditions.liquiditySweep  || {};
  const rj = conditions.rejectionCandle || {};
  const vl = conditions.volumeSpike     || {};

  const signalAge  = latestSignal ? Date.now() - latestSignal.timestamp : Infinity;
  const showBanner = latestSignal && signalAge < 300_000;

  const xauTabs = [
    { id: 'signals',  icon: '⚡', label: 'Live Signals' },
    { id: 'chart',    icon: '📈', label: 'M1 Chart'     },
    { id: 'history',  icon: '📋', label: 'History'      },
    { id: 'backtest', icon: '📊', label: 'Backtest'     },
    { id: 'log',      icon: '🗒️', label: 'Signal Log'   },
  ];

  return (
    <div>
      {/* ── Sub-tabs ── */}
      <div style={{ display:'flex', alignItems:'center', gap:'2px', padding:'0 20px', height:'40px', borderBottom:'1px solid var(--border)', background:'var(--surface)' }}>
        {xauTabs.map(t => (
          <button key={t.id} className={`nav-tab${activeTab === t.id ? ' active' : ''}`}
            style={{ fontSize:'12px' }} onClick={() => setTab(t.id)}>
            <span className="nav-tab-icon">{t.icon}</span>{t.label}
          </button>
        ))}
      </div>

      <main className="main">

        {/* ── Live Signals Tab ── */}
        {activeTab === 'signals' && (
          <div style={{ display:'flex', flexDirection:'column', gap:'16px' }}>

            {/* Strategy header */}
            <div className="xau-strat-header">
              <div>
                <div className="xau-strat-title">⚡ XAU SCALP STRATEGY</div>
                <div className="xau-strat-sub">M1 · XAUUSD · Long-only · Order-block pullbacks</div>
              </div>
              <div className="xau-strat-right">
                <div className="xau-live-badge">LIVE</div>
                <div className="xau-price-live">{livePrice ? livePrice.toFixed(2) : '—'}</div>
                {livePrice && (
                  <div className={`xau-price-change ${chgAmt >= 0 ? 'up' : 'dn'}`}>
                    {chgSign}{chgAmt.toFixed(2)} ({chgPct}%)
                  </div>
                )}
              </div>
            </div>

            {/* Signal banner */}
            {showBanner && (
              <div className={`xau-signal-banner ${latestSignal.strength.toLowerCase()}`}>
                ⚡ {latestSignal.strength} BUY SIGNAL &nbsp;·&nbsp;
                Entry: {latestSignal.entryPrice.toFixed(2)} &nbsp;|&nbsp;
                SL: {latestSignal.stopLoss.toFixed(2)} &nbsp;|&nbsp;
                TP: {latestSignal.takeProfit.toFixed(2)} &nbsp;|&nbsp;
                R:R 1:{latestSignal.riskReward.toFixed(1)}
              </div>
            )}

            {/* 5 Condition Cards */}
            <div className="xau-cond-grid">
              <XauCondCard icon="📈" name="Uptrend" active={ut.active}
                value={ut.active ? `${(ut.strength||'').toUpperCase()} — ${ut.higherHighs||0}HH ${ut.higherLows||0}HL` : 'No uptrend'}
                badge={ut.active ? '✅ ACTIVE' : '❌ INACTIVE'} />
              <XauCondCard icon="🎯" name="Demand Zone" active={dz.active}
                value={dz.active && dz.zone ? `${dz.zone.zoneLow?.toFixed(1)} – ${dz.zone.zoneHigh?.toFixed(1)}` : 'No zone'}
                badge={dz.active ? '✅ IN ZONE' : '❌ INACTIVE'} />
              <XauCondCard icon="💧" name="Liq. Sweep" active={lq.active}
                value={lq.active ? `Swept −${(lq.sweep||{}).depth||0} pips` : 'No sweep'}
                badge={lq.active ? '✅ SWEPT' : '❌ INACTIVE'} />
              <XauCondCard icon="🕯️" name="Rejection" active={rj.active}
                value={rj.active ? 'Rejection found' : 'No rejection'}
                badge={rj.active ? '✅ ACTIVE' : '❌ INACTIVE'} />
              <XauCondCard icon="📊" name="Volume Spike" active={vl.active}
                value={`${vl.ratio||0}× avg${vl.active ? ` (${(vl.strength||'').replace('_',' ')})` : ''}`}
                badge={vl.active ? '✅ SPIKE' : '❌ LOW VOL'} />
            </div>

            {/* Latest Signal Detail */}
            {latestSignal && (
              <div className="xau-signal-card">
                <div className="xau-signal-card-hd">
                  <div className={`xau-signal-card-title ${latestSignal.strength.toLowerCase()}`}>
                    {latestSignal.strength === 'STRONG' ? '⚡ STRONG LONG SIGNAL' : '⚡ MEDIUM LONG SIGNAL'}
                  </div>
                  <div className="xau-signal-time">
                    {new Date(latestSignal.timestamp).toUTCString().slice(5, 22)} UTC
                  </div>
                </div>
                <div className="xau-signal-grid">
                  {[
                    ['Entry',        latestSignal.entryPrice?.toFixed(2),  'g'],
                    ['Stop Loss',    latestSignal.stopLoss?.toFixed(2),    'r'],
                    ['Take Profit',  latestSignal.takeProfit?.toFixed(2),  'g'],
                    ['R:R',          `1:${latestSignal.riskReward?.toFixed(1)}`, 'a'],
                    ['Risk (pips)',  `${latestSignal.riskPips} pips`,      ''],
                    ['Reward (pips)',`${latestSignal.rewardPips} pips`,    ''],
                    ['ATR',          latestSignal.atrValue?.toFixed(2),    ''],
                    ['Break Even',   latestSignal.breakEvenAt?.toFixed(2), ''],
                  ].map(([lbl, val, cls], i) => (
                    <div key={i}>
                      <div className="xau-signal-field-lbl">{lbl}</div>
                      <div className={`xau-signal-field-val${cls ? ' '+cls : ''}`}>{val || '—'}</div>
                    </div>
                  ))}
                </div>
                <div className="xau-cond-list">
                  {[
                    [latestSignal.conditions?.uptrend,          `Uptrend (${latestSignal.trendStrength||'—'})`],
                    [latestSignal.conditions?.inDemandZone,     `Demand Zone (${latestSignal.zone?.strength||'—'})`],
                    [latestSignal.conditions?.liquiditySweep,   `Liquidity Sweep (−${latestSignal.sweepDepth||0} pips)`],
                    [latestSignal.conditions?.rejectionCandle,  'Rejection Candle'],
                    [latestSignal.conditions?.volumeSpike,      `Volume Spike (${latestSignal.volumeRatio||0}× average)`],
                  ].map(([ok, label], i) => (
                    <div key={i} className="xau-cond-row">
                      <span style={{ fontSize: '14px' }}>{ok ? '✅' : '❌'}</span>
                      <span>{label}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Stats Bar */}
            <div className="xau-stats-bar">
              <div className="xau-stat-card"><div className="xau-stat-lbl">Total Signals</div><div className="xau-stat-val">{stats.totalSignals||0}</div></div>
              <div className="xau-stat-card"><div className="xau-stat-lbl">Strong Signals</div><div className="xau-stat-val g">{stats.strongSignals||0}</div></div>
              <div className="xau-stat-card"><div className="xau-stat-lbl">Medium Signals</div><div className="xau-stat-val a">{stats.mediumSignals||0}</div></div>
              <div className="xau-stat-card"><div className="xau-stat-lbl">M1 Candles</div><div className="xau-stat-val">{stats.candleCount||0}</div></div>
              <div className="xau-stat-card">
                <div className="xau-stat-lbl">Last Signal</div>
                <div className="xau-stat-val" style={{ fontSize: '14px' }}>
                  {stats.lastSignalTime ? new Date(stats.lastSignalTime).toUTCString().slice(5, 17) : '—'}
                </div>
              </div>
            </div>

          </div>
        )}

        {/* ── M1 Chart Tab ── */}
        {activeTab === 'chart' && (
          <div className="card" style={{ overflow: 'hidden' }}>
            <div className="card-hd">
              <span className="card-title">XAUUSD · M1 · Live</span>
              {livePrice && (
                <span style={{ fontFamily: 'monospace', fontSize: '13px', color: 'var(--text)', fontWeight: 700 }}>
                  {livePrice.toFixed(2)}
                  <span style={{ marginLeft: 8, fontSize: 11, color: chgAmt >= 0 ? 'var(--win)' : 'var(--loss)' }}>
                    {chgSign}{chgAmt.toFixed(2)}
                  </span>
                </span>
              )}
            </div>
            <div ref={chartContRef} style={{ height: '380px', background: '#131722' }} />
            <div ref={volContRef}   style={{ height: '80px',  background: '#131722', borderTop: '1px solid #1e222d' }} />
          </div>
        )}

        {/* ── Backtest Tab ── */}
        {activeTab === 'backtest' && <XauBacktestPanel />}

        {/* ── Signal Log Tab ── */}
        {activeTab === 'log' && <XauSignalLogPanel />}

        {/* ── History Tab ── */}
        {activeTab === 'history' && (
          <div className="card">
            <div className="card-hd">
              <span className="card-title">Signal History</span>
              <span className="badge badge-gray">{signalHistory.length} signals</span>
            </div>
            <div className="tbl-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Time (UTC)</th><th>Type</th><th>Entry</th>
                    <th>Stop</th><th>Target</th><th>R:R</th>
                    <th>Strength</th><th>Outcome</th>
                  </tr>
                </thead>
                <tbody>
                  {signalHistory.length === 0 && (
                    <tr><td colSpan="8" className="sig-empty">No signals yet — waiting for entry conditions</td></tr>
                  )}
                  {signalHistory.map((s, i) => {
                    const t  = new Date(s.timestamp).toUTCString().slice(5, 17);
                    const oc = s.outcome === 'WIN' ? 'badge-green' : s.outcome === 'LOSS' ? 'badge-red' : 'badge-gray';
                    const sc = s.strength === 'STRONG' ? 'badge-green' : 'badge-gray';
                    return (
                      <tr key={i}>
                        <td className="td-mono td-muted">{t}</td>
                        <td className="td-buy">LONG</td>
                        <td className="td-mono">{s.entryPrice?.toFixed(2)}</td>
                        <td className="td-loss">{s.stopLoss?.toFixed(2)}</td>
                        <td className="td-win">{s.takeProfit?.toFixed(2)}</td>
                        <td className="td-mono">{s.riskReward?.toFixed(1)}</td>
                        <td><span className={`badge ${sc}`}>{s.strength}</span></td>
                        <td><span className={`badge ${oc}`}>{s.outcome || 'PENDING'}</span></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}

      </main>
    </div>
  );
}


/* ─────────────────────────────────────────────────────────────────────────────
   Strategy Registry
───────────────────────────────────────────────────────────────────────────── */
const StrategyRegistry = {
  'rsi-ema': {
    id: 'rsi-ema', icon: '📊', name: 'RSI EMA',
    timeframe: '5m / 15m / 1H',
    tabs: [
      { id: 'backtest', icon: '📊', label: 'Backtest'        },
      { id: 'signals',  icon: '⚡', label: 'Signal History'  },
    ],
    defaultTab: 'backtest',
  },
  'xau-scalp': {
    id: 'xau-scalp', icon: '⚡', name: 'XAU SCALP',
    timeframe: 'M1',
    externalUrl: '/dashboard/xau-scalp',
    tabs: [], // managed internally by XauScalpWorkspace
    defaultTab: 'signals',
  },
};

function App() {
  const [clock, setClock] = useState('');
  const routeStrategy = (() => {
    try {
      const path = window.location.pathname;
      if (path === '/dashboard/rsi-ema') return 'rsi-ema';
      if (path === '/index.html') return 'rsi-ema';
      return null;
    } catch {
      return null;
    }
  })();

  // ── Active strategy — persisted across page reloads ─────────────────────
  const [activeStrategy, setActiveStrategy] = useState(() => {
    try { return routeStrategy || localStorage.getItem('activeStrategy') || 'rsi-ema'; } catch { return routeStrategy || 'rsi-ema'; }
  });

  // ── RSI-EMA tab state — isolated to this strategy ───────────────────────
  const [rsiTab, setRsiTab] = useState(() => {
    try {
      const saved = localStorage.getItem('strategy:rsi-ema:tab');
      // Only allow valid tabs; ignore 'chart' and 'live' which were removed
      return (saved && ['backtest', 'signals'].includes(saved)) ? saved : 'backtest';
    } catch { return 'backtest'; }
  });

  // ── RSI-EMA backtest result — isolated ──────────────────────────────────
  const [backtestResult, setBacktestResult] = useState(() => {
    try {
      const saved = localStorage.getItem('strategy:rsi-ema:backtest');
      return saved ? JSON.parse(saved) : null;
    } catch { return null; }
  });

  const handleStrategyChange = useCallback((id) => {
    if (id === 'xau-scalp') {
      window.location.href = '/dashboard/xau-scalp';
      return;
    }
    setActiveStrategy(id);
    try { localStorage.setItem('activeStrategy', id); } catch {}
  }, []);

  useEffect(() => {
    if (!routeStrategy) return;
    setActiveStrategy(routeStrategy);
    try { localStorage.setItem('activeStrategy', routeStrategy); } catch {}
  }, [routeStrategy]);

  const handleRsiTabChange = useCallback((tab) => {
    setRsiTab(tab);
    try { localStorage.setItem('strategy:rsi-ema:tab', tab); } catch {}
  }, []);

  const handleBacktestComplete = useCallback((data) => {
    setBacktestResult(data);
    try { localStorage.setItem('strategy:rsi-ema:backtest', JSON.stringify(data)); } catch {}
  }, []);

  const handleHistoryLoad = useCallback((reportDoc) => {
    const result = {
      metrics:      reportDoc.metrics      || {},
      trades:       reportDoc.trades       || [],
      equity_curve: reportDoc.equity_curve || [],
      mongo_id:     reportDoc._id,
    };
    setBacktestResult(result);
    try { localStorage.setItem('strategy:rsi-ema:backtest', JSON.stringify(result)); } catch {}
    handleRsiTabChange('backtest');
  }, []);

  useEffect(() => {
    const tick = () => setClock(new Date().toUTCString().slice(5, 22) + ' UTC');
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, []);

  const strat = StrategyRegistry[activeStrategy];

  return (
    <div>
      {/* ── Main Nav ── */}
      <nav id="main-nav">
        <div className="nav-brand">SEAN ALGO</div>
        <div className="nav-links">
          <a href="/dashboard/rsi-ema" className="nav-item active" id="nav-rsi">RSI EMA</a>
          <a href="/dashboard/xau-scalp" className="nav-item" id="nav-xau">XAU SCALP</a>
          <a href="/dashboard/live-bot" className="nav-item nav-live" id="nav-bot">
            <span className="bot-dot" id="bot-status-dot"></span>
            LIVE BOT
          </a>
        </div>
      </nav>

      {/* ── Page title ── */}
      <div style={{padding:'20px 24px 0', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
        <div>
          <h1 style={{margin:0, fontSize:'18px', fontWeight:700, color:'#d1d4dc'}}>RSI EMA STRATEGY</h1>
          <p style={{margin:'4px 0 0', fontSize:'13px', color:'#787b86'}}>Backtest results and signal history</p>
        </div>
      </div>

      {/* ── RSI EMA tab bar ── */}
      {activeStrategy === 'rsi-ema' && (
        <div style={{ display:'flex', alignItems:'center', gap:'2px', padding:'12px 24px 0' }}>
          {strat.tabs.map(t => (
            <button key={t.id}
              className={`nav-tab${rsiTab === t.id ? ' active' : ''}`}
              style={{ fontSize: '12px' }}
              onClick={() => handleRsiTabChange(t.id)}>
              <span className="nav-tab-icon">{t.icon}</span>{t.label}
            </button>
          ))}
        </div>
      )}

      {/* ── RSI EMA Workspace ── */}
      {activeStrategy === 'rsi-ema' && (
        <main className="main">
          {rsiTab === 'backtest' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <BacktestPanel onBacktestComplete={handleBacktestComplete} initialResult={backtestResult} />
              <BacktestHistoryPanel onLoad={handleHistoryLoad} />
              <TradeHistoryPanel backtestResult={backtestResult} />
            </div>
          )}
          {rsiTab === 'signals' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <LiveSignalsPanel />
            </div>
          )}
        </main>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
(function(){
  fetch('/api/bot/status').then(r=>r.json()).then(d=>{
    const dot = document.getElementById('bot-status-dot');
    if(dot) dot.classList.toggle('running', !!(d.rsiEma?.running || d.xauScalp?.running));
  }).catch(()=>{});
})();
</script>
</body>
</html>
