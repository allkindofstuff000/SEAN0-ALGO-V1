/* ─────────────────────────────────────────────────────────────────────────────
   Indicator Engine  —  pure math, no React, no DOM
───────────────────────────────────────────────────────────────────────────── */
class IndicatorEngine {
  /* EMA */
  static calcEMA(closes, period) {
    const n = closes.length;
    const out = new Array(n).fill(null);
    if (n < period) return out;
    const k = 2 / (period + 1);
    let sum = 0;
    for (let i = 0; i < period; i++) sum += closes[i];
    out[period - 1] = sum / period;
    for (let i = period; i < n; i++) out[i] = closes[i] * k + out[i - 1] * (1 - k);
    return out;
  }

  /* RSI — Wilder's smoothing */
  static calcRSI(closes, period = 14) {
    const n = closes.length;
    const out = new Array(n).fill(null);
    if (n < period + 1) return out;
    let ag = 0, al = 0;
    for (let i = 1; i <= period; i++) {
      const d = closes[i] - closes[i - 1];
      if (d > 0) ag += d; else al -= d;
    }
    ag /= period; al /= period;
    out[period] = 100 - 100 / (1 + (al === 0 ? 100 : ag / al));
    for (let i = period + 1; i < n; i++) {
      const d = closes[i] - closes[i - 1];
      ag = (ag * (period - 1) + Math.max(d, 0)) / period;
      al = (al * (period - 1) + Math.max(-d, 0)) / period;
      out[i] = 100 - 100 / (1 + (al === 0 ? 100 : ag / al));
    }
    return out;
  }

  /* MACD */
  static calcMACD(closes, fast = 12, slow = 26, sig = 9) {
    const n = closes.length;
    const ef = IndicatorEngine.calcEMA(closes, fast);
    const es = IndicatorEngine.calcEMA(closes, slow);
    const ml = new Array(n).fill(null);
    for (let i = slow - 1; i < n; i++) {
      if (ef[i] !== null && es[i] !== null) ml[i] = ef[i] - es[i];
    }
    // signal = EMA of MACD line (only over defined values)
    const defStart = slow - 1;
    const mlSlice  = ml.slice(defStart).map(v => v === null ? 0 : v);
    const sigSlice = IndicatorEngine.calcEMA(mlSlice, sig);
    const sl = new Array(n).fill(null);
    for (let i = 0; i < sigSlice.length; i++) sl[defStart + i] = sigSlice[i];
    const hist = new Array(n).fill(null);
    for (let i = 0; i < n; i++) {
      if (ml[i] !== null && sl[i] !== null) hist[i] = ml[i] - sl[i];
    }
    return { macdLine: ml, signalLine: sl, histogram: hist };
  }

  /* VWAP — daily reset at 00:00 UTC */
  static calcVWAP(candles) {
    const n = candles.length;
    const vwap = new Array(n).fill(null);
    const ub1  = new Array(n).fill(null);
    const lb1  = new Array(n).fill(null);
    const ub2  = new Array(n).fill(null);
    const lb2  = new Array(n).fill(null);
    let cumTPV = 0, cumVol = 0, cumTPV2 = 0, dayKey = -1;
    for (let i = 0; i < n; i++) {
      const c  = candles[i];
      const dk = Math.floor(c.time / 86400);
      if (dk !== dayKey) { dayKey = dk; cumTPV = cumVol = cumTPV2 = 0; }
      const tp = (c.high + c.low + c.close) / 3;
      const vol = c.volume || 1;
      cumTPV  += tp * vol;
      cumTPV2 += tp * tp * vol;
      cumVol  += vol;
      const v  = cumTPV / cumVol;
      const sd = Math.sqrt(Math.max(cumTPV2 / cumVol - v * v, 0));
      vwap[i] = v;
      ub1[i] = v + sd;  lb1[i] = v - sd;
      ub2[i] = v + 2*sd; lb2[i] = v - 2*sd;
    }
    return { vwap, ub1, lb1, ub2, lb2 };
  }

  /* VCAD — Accumulation/Distribution Line */
  static calcVCAD(candles) {
    const n = candles.length;
    const out = new Array(n).fill(null);
    let ad = 0;
    for (let i = 0; i < n; i++) {
      const c = candles[i];
      const hl = c.high - c.low;
      if (!hl) { out[i] = ad; continue; }
      const mfm = ((c.close - c.low) - (c.high - c.close)) / hl;
      ad += mfm * (c.volume || 1);
      out[i] = ad;
    }
    return out;
  }

  /* Fibonacci auto-levels from last N candles */
  static calcFib(candles, lookback = 50) {
    const sl = candles.slice(-lookback);
    if (sl.length < 2) return null;
    let hi = -Infinity, lo = Infinity;
    for (const c of sl) { if (c.high > hi) hi = c.high; if (c.low < lo) lo = c.low; }
    const rng = hi - lo;
    if (rng < 1e-8) return null;
    return [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1.0, 1.272, 1.618].map(lv => ({
      level: lv, price: hi - rng * lv, label: `${(lv * 100).toFixed(1)}%`,
    }));
  }

  /* Long/Short composite signals */
  static calcSignals(candles, rsi, macdData, ema50, ema200, fib, minScore = 3) {
    const signals = [];
    const fib618  = fib ? fib.find(f => f.level === 0.618) : null;
    for (let i = 1; i < candles.length; i++) {
      const c  = candles[i];
      const pr = rsi[i - 1], cr = rsi[i];
      const e5 = ema50[i], e2 = ema200[i];
      const ml = macdData.macdLine[i], ms = macdData.signalLine[i];
      const pm = macdData.macdLine[i - 1], ps = macdData.signalLine[i - 1];
      if (cr === null || e5 === null || e2 === null || ml === null || ms === null) continue;
      const near618 = fib618 && Math.abs(c.close - fib618.price) / fib618.price < 0.003;
      const lc = [
        (pr !== null && pr < 30 && cr >= 30) || (cr > 40 && cr < 60 && cr > pr),
        pm !== null && ps !== null && pm <= ps && ml > ms,
        c.close > e5,
        e5 > e2 || near618,
        c.close > c.open,
      ];
      const sc = [
        (pr !== null && pr > 70 && cr <= 70) || (cr > 40 && cr < 60 && cr < pr),
        pm !== null && ps !== null && pm >= ps && ml < ms,
        c.close < e5,
        e5 < e2 || near618,
        c.close < c.open,
      ];
      const ls = lc.filter(Boolean).length;
      const ss = sc.filter(Boolean).length;
      if (ls >= minScore && ls >= ss) {
        signals.push({ time: c.time, direction: 'long',  score: ls, price: c.low,  conditions: lc });
      } else if (ss >= minScore) {
        signals.push({ time: c.time, direction: 'short', score: ss, price: c.high, conditions: sc });
      }
    }
    return signals;
  }

  /* Full batch calculation */
  static calculate(candles, params = {}) {
    const { rsiPeriod = 14, emaFast = 50, emaSlow = 200,
            macdFast = 12, macdSlow = 26, macdSignal = 9,
            fibLookback = 50, minSignalStrength = 3 } = params;
    if (!candles || candles.length < 2) return null;
    const closes = candles.map(c => c.close);
    const ema50  = IndicatorEngine.calcEMA(closes, emaFast);
    const ema200 = IndicatorEngine.calcEMA(closes, emaSlow);
    const rsi    = IndicatorEngine.calcRSI(closes, rsiPeriod);
    const macd   = IndicatorEngine.calcMACD(closes, macdFast, macdSlow, macdSignal);
    const vwap   = IndicatorEngine.calcVWAP(candles);
    const vcad   = IndicatorEngine.calcVCAD(candles);
    const fib    = IndicatorEngine.calcFib(candles, fibLookback);
    const signals = IndicatorEngine.calcSignals(candles, rsi, macd, ema50, ema200, fib, minSignalStrength);
    return { closes, ema50, ema200, rsi, macd, vwap, vcad, fib, signals };
  }
}

    const live = liveRef.current[activeTfRef.current];
    if (live && Number.isFinite(live.close)) return live.close;
    const hist = cacheRef.current[activeTfRef.current] || [];
    const last = hist[hist.length - 1];
    return Number.isFinite(last?.close) ? last.close : null;
  }

  function buildPositionDraft(dir) {
    const price = getReferencePrice();
    const qty = position?.qty ? String(position.qty) : '1';
    const anchorTime = getActiveAnchorTime();
    if (!Number.isFinite(price)) return { dir, entry:'', tp:'', sl:'', qty, anchorTime };
    const entry = Number(price);
    const tp = dir === 'long' ? entry * 1.005 : entry * 0.995;
    const sl = dir === 'long' ? entry * 0.995 : entry * 1.005;
    return {
      dir,
      entry: entry.toFixed(2),
      tp: tp.toFixed(2),
      sl: sl.toFixed(2),
      qty,
      anchorTime,
    };
  }

  function openPositionTool(dir) {
    if (position && position.dir === dir) {
      setPosForm({
        dir,
        entry: Number(position.entry).toFixed(2),
        tp: Number(position.tp).toFixed(2),
        sl: Number(position.sl).toFixed(2),
        qty: String(position.qty ?? 1),
        anchorTime: position.anchorTime ?? getActiveAnchorTime(),
      });
    } else {
      setPosForm(buildPositionDraft(dir));
    }
    setShowPosModal(true);
  }

  // Keep refs in sync with state for use inside closures
  useEffect(() => { togglesRef.current = indicators; }, [indicators]);
  useEffect(() => { paramsRef.current  = indParams;  }, [indParams]);

  // ── Position tool: price lines + localStorage ──────────────────────────────
  useEffect(() => {

    try { localStorage.setItem('tv_pos', JSON.stringify(position)); } catch {}
    if (!candleRef.current) return;
    [posTPRef, posSLRef, posEnRef].forEach(r => { if (r.current) { try { candleRef.current.removePriceLine(r.current); } catch {} r.current = null; } });
    if (!position || !LC) return;
    const LS = LC.LineStyle;
    const isLong = position.dir === 'long';
    const tpKind = classifyPositionLevel(position.tp, position.entry, isLong);
    const slKind = classifyPositionLevel(position.sl, position.entry, isLong);
    const tpColors = levelColors(tpKind);
    const slColors = levelColors(slKind);
    posEnRef.current = candleRef.current.createPriceLine({ price:position.entry, color:'#2196F3', lineWidth:1, lineStyle:LS.Dashed, axisLabelVisible:true, title:'' });
    posTPRef.current = candleRef.current.createPriceLine({ price:position.tp,    color:tpColors.line, lineWidth:1, lineStyle:LS.Solid,  axisLabelVisible:false, title:'' });
    posSLRef.current = candleRef.current.createPriceLine({ price:position.sl,    color:slColors.line, lineWidth:1, lineStyle:LS.Solid,  axisLabelVisible:false, title:'' });
  }, [position]);

  // ── Drag handler for position lines ────────────────────────────────────────
  function startDrag(e, field) {
    e.preventDefault(); e.stopPropagation();
    const onMove = me => {
      if (!containerRef.current || !candleRef.current) return;
      const rect = containerRef.current.getBoundingClientRect();
      const y = me.clientY - rect.top;
      const raw = candleRef.current.coordinateToPrice(y);
      if (raw === null) return;
      const p = Math.round(raw * 100) / 100;
      setPosition(prev => {
        if (!prev) return prev;
        if (field === 'tp')    return {...prev, tp: p};
        if (field === 'sl')    return {...prev, sl: p};
        if (field === 'entry') {
          const d = p - prev.entry;
          return {...prev, entry:p, tp:Math.round((prev.tp+d)*100)/100, sl:Math.round((prev.sl+d)*100)/100};
        }
        return prev;
      });
      setPosVersion(v => v + 1);
    };
    const onUp = () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  }

  // ── Chart creation (once on mount) ─────────────────────────────────────────

  useEffect(() => {

    chart.timeScale().subscribeVisibleLogicalRangeChange(() => { if (posDataRef.current) setPosVersion(v => v + 1); });
    try { chart.priceScale('right').subscribeVisiblePriceRangeChange(() => { if (posDataRef.current) setPosVersion(v => v + 1); }); } catch {}
    // EMA series on main chart
    const e50  = chart.addLineSeries({ color:'#2196F3', lineWidth:1, title:'EMA50',  lastValueVisible:false, priceLineVisible:false });
    const e200 = chart.addLineSeries({ color:'#FF6D00', lineWidth:2, title:'EMA200', lastValueVisible:false, priceLineVisible:false });
    // VWAP series on main chart
    const vw   = chart.addLineSeries({ color:'#FF6D00', lineWidth:2, title:'VWAP',   lastValueVisible:false, priceLineVisible:false });
    const vub1 = chart.addLineSeries({ color:'#ef5350', lineWidth:1, lineStyle:2,    lastValueVisible:false, priceLineVisible:false });
    const vlb1 = chart.addLineSeries({ color:'#26a69a', lineWidth:1, lineStyle:2,    lastValueVisible:false, priceLineVisible:false });
    const vub2 = chart.addLineSeries({ color:'rgba(239,83,80,.4)', lineWidth:1, lineStyle:2, lastValueVisible:false, priceLineVisible:false });
    const vlb2 = chart.addLineSeries({ color:'rgba(38,166,154,.4)', lineWidth:1, lineStyle:2, lastValueVisible:false, priceLineVisible:false });

    chartRef.current = chart; candleRef.current = series;
    ema50Ref.current = e50;  ema200Ref.current = e200;
    vwapRef.current  = vw;   vwapUB1Ref.current = vub1; vwapLB1Ref.current = vlb1;
    vwapUB2Ref.current = vub2; vwapLB2Ref.current = vlb2;

    // RSI sub-chart
    if (rsiContainerRef.current) {
      const rc = LC.createChart(rsiContainerRef.current, {
        ...CHART_OPTS(0, true),
        rightPriceScale: { borderColor:'#2a2e39', scaleMargins:{ top:0.1, bottom:0.1 } },
      });
      const rs = rc.addLineSeries({ color:'#7b1fa2', lineWidth:2, lastValueVisible:false, priceLineVisible:false });
      rs.createPriceLine({ price:70, color:'rgba(239,83,80,.6)',  lineWidth:1, lineStyle:2, axisLabelVisible:true,  title:'70' });
      rs.createPriceLine({ price:50, color:'rgba(120,123,134,.4)',lineWidth:1, lineStyle:2, axisLabelVisible:false, title:'50' });
      rs.createPriceLine({ price:30, color:'rgba(38,166,154,.6)', lineWidth:1, lineStyle:2, axisLabelVisible:true,  title:'30' });
      rc.applyOptions({ watermark:{ visible:false } });
      rsiChartRef.current = rc; rsiSerRef.current = rs;
    }

    // MACD sub-chart
    if (macdContainerRef.current) {
      const mc   = LC.createChart(macdContainerRef.current, {
        ...CHART_OPTS(0, true),
        rightPriceScale: { borderColor:'#2a2e39', scaleMargins:{ top:0.15, bottom:0.15 } },
      });
      const mh   = mc.addHistogramSeries({ lastValueVisible:false, priceLineVisible:false });
      const ml   = mc.addLineSeries({ color:'#2196F3', lineWidth:1, lastValueVisible:false, priceLineVisible:false });
      const msl  = mc.addLineSeries({ color:'#FF6D00', lineWidth:1, lastValueVisible:false, priceLineVisible:false });
      mh.createPriceLine({ price:0, color:'rgba(120,123,134,.4)', lineWidth:1, lineStyle:2, axisLabelVisible:false });
      macdChartRef.current = mc; macdHistRef.current = mh;
      macdLineRef.current  = ml; macdSigRef.current  = msl;
    }

    // VCAD sub-chart
    if (vcadContainerRef.current) {
      const vc  = LC.createChart(vcadContainerRef.current, {
        ...CHART_OPTS(0, true),
        rightPriceScale: { borderColor:'#2a2e39', scaleMargins:{ top:0.1, bottom:0.1 } },
      });
      const vs  = vc.addLineSeries({ color:'#7b1fa2', lineWidth:1, lastValueVisible:false, priceLineVisible:false });
      vs.createPriceLine({ price:0, color:'rgba(120,123,134,.4)', lineWidth:1, lineStyle:2, axisLabelVisible:false });
      vcadChartRef.current = vc; vcadSerRef.current = vs;
    }

    // Sync time ranges between all charts
    function syncRange(src, ...targets) {
      const us = src.timeScale().subscribeVisibleLogicalRangeChange(range => {
        if (!range) return;
        targets.forEach(t => { try { t && t.timeScale().setVisibleLogicalRange(range); } catch {} });
      });
      syncUnsub.current.push(us);
    }
    const subCharts = [rsiChartRef.current, macdChartRef.current, vcadChartRef.current].filter(Boolean);
    syncRange(chart, ...subCharts);
    subCharts.forEach(sc => syncRange(sc, chart, ...subCharts.filter(x => x !== sc)));

    return () => {
      syncUnsub.current.forEach(u => { try { u && u(); } catch {} });
      [chart, rsiChartRef.current, macdChartRef.current, vcadChartRef.current].forEach(c => {
        try { c && c.remove(); } catch {}
      });
      chartRef.current = candleRef.current = null;
      rsiChartRef.current = rsiSerRef.current = null;
      macdChartRef.current = macdHistRef.current = macdLineRef.current = macdSigRef.current = null;
      vcadChartRef.current = vcadSerRef.current = null;
    };
  }, []);

  // ── Helper: build lightweight-charts data arrays from indicator results ──────
  function _buildIndData(candles, data) {
    if (!candles || !data) return;
    const n = candles.length;

    // EMA series
    const e50Data  = [], e200Data = [];
    for (let i = 0; i < n; i++) {
      if (data.ema50[i]  !== null) e50Data.push({ time:candles[i].time, value:data.ema50[i] });
      if (data.ema200[i] !== null) e200Data.push({ time:candles[i].time, value:data.ema200[i] });
    }
    // VWAP series
    const vwData = [], ub1D = [], lb1D = [], ub2D = [], lb2D = [];
    for (let i = 0; i < n; i++) {
      const t = candles[i].time;
      if (data.vwap.vwap[i] !== null) {
        vwData.push({ time:t, value:data.vwap.vwap[i] });
        ub1D.push({ time:t, value:data.vwap.ub1[i] });
        lb1D.push({ time:t, value:data.vwap.lb1[i] });
        ub2D.push({ time:t, value:data.vwap.ub2[i] });
        lb2D.push({ time:t, value:data.vwap.lb2[i] });
      }
    }
    // RSI series
    const rsiData = [];
    for (let i = 0; i < n; i++) {
      if (data.rsi[i] !== null) rsiData.push({ time:candles[i].time, value:data.rsi[i] });
    }
    // MACD histogram + lines
    const histData = [], mlData = [], slData = [];
    for (let i = 0; i < n; i++) {
      const t = candles[i].time;
      const h = data.macd.histogram[i];
      const ml = data.macd.macdLine[i];
      const sl = data.macd.signalLine[i];
      if (h !== null) {
        const prev = i > 0 ? data.macd.histogram[i - 1] : null;
        let color;
        if (h >= 0) color = (prev === null || h >= prev) ? '#26a69a' : 'rgba(38,166,154,.5)';
        else        color = (prev === null || h <= prev) ? '#ef5350' : 'rgba(239,83,80,.5)';
        histData.push({ time:t, value:h, color });
      }
      if (ml !== null) mlData.push({ time:t, value:ml });
      if (sl !== null) slData.push({ time:t, value:sl });
    }
    // VCAD series
    const vcadData = [];
    for (let i = 0; i < n; i++) {
      if (data.vcad[i] !== null) vcadData.push({ time:candles[i].time, value:data.vcad[i] });
    }
    return { e50Data, e200Data, vwData, ub1D, lb1D, ub2D, lb2D, rsiData, histData, mlData, slData, vcadData };
  }

  // ── Render all indicators for current data ─────────────────────────────────
  function _renderIndicators(candles, data, builtData) {
    if (!candleRef.current || !data) return;
    const tg = togglesRef.current;
    const bd = builtData || _buildIndData(candles, data);
    if (!bd) return;

    // EMA
    try {
      ema50Ref.current.applyOptions({ visible: tg.ema });
      ema200Ref.current.applyOptions({ visible: tg.ema });
      if (tg.ema) {
        ema50Ref.current.setData(bd.e50Data);
        ema200Ref.current.setData(bd.e200Data);
        // Golden/Death cross markers
        _checkEMACrossMarkers(candles, data.ema50, data.ema200);
      }
    } catch(e) {}

    // VWAP
    try {
      [vwapRef,vwapUB1Ref,vwapLB1Ref,vwapUB2Ref,vwapLB2Ref].forEach(r => r.current && r.current.applyOptions({ visible: tg.vwap }));
      if (tg.vwap && bd.vwData.length) {
        vwapRef.current.setData(bd.vwData);
        vwapUB1Ref.current.setData(bd.ub1D);
        vwapLB1Ref.current.setData(bd.lb1D);
        vwapUB2Ref.current.setData(bd.ub2D);
        vwapLB2Ref.current.setData(bd.lb2D);
      }
    } catch(e) {}

    // Fibonacci price lines
    try {
      fibLinesRef.current.forEach(pl => { try { candleRef.current.removePriceLine(pl); } catch {} });
      fibLinesRef.current = [];
      if (tg.fib && data.fib) {
        const fibColors = { 0:'#787B86', 0.236:'#F23645', 0.382:'#FF9800', 0.5:'#4CAF50',
                            0.618:'#2196F3', 0.786:'#9C27B0', 1.0:'#787B86', 1.272:'#26a69a', 1.618:'#ef5350' };
        data.fib.forEach(lv => {
          const pl = candleRef.current.createPriceLine({
            price: lv.price, color: fibColors[lv.level] || '#888',
            lineWidth: lv.level === 0.618 ? 2 : 1, lineStyle: 2,
            axisLabelVisible: true, title: lv.label,
          });
          fibLinesRef.current.push(pl);
        });
      }
    } catch(e) {}

    // Long/Short signal markers
    try {
      if (tg.ls && data.signals && data.signals.length) {
        const markers = data.signals.map(s => ({
          time: s.time,
          position: s.direction === 'long' ? 'belowBar' : 'aboveBar',
          color:    s.direction === 'long'
            ? (s.score === 5 ? '#00E676' : '#26a69a')
            : (s.score === 5 ? '#FF1744' : '#ef5350'),
          shape:    s.direction === 'long' ? 'arrowUp' : 'arrowDown',
          text:     s.direction === 'long' ? 'L' : 'S',
          size: s.score >= 5 ? 2 : 1,
        }));
        candleRef.current.setMarkers(markers.sort((a,b) => a.time - b.time));
        setSignalLog(data.signals.slice(-20).reverse());
      } else {
        candleRef.current.setMarkers([]);
        if (!tg.ls) setSignalLog([]);
      }
    } catch(e) {}

    // RSI sub-chart
    try {
      if (rsiSerRef.current && bd.rsiData.length) {
        rsiSerRef.current.setData(bd.rsiData);
        const last = bd.rsiData[bd.rsiData.length - 1];
        if (last) setRsiDisp(last.value);
      }
    } catch(e) {}

    // MACD sub-chart
    try {
      if (macdHistRef.current && bd.histData.length) {
        macdHistRef.current.setData(bd.histData);
        macdLineRef.current.setData(bd.mlData);
        macdSigRef.current.setData(bd.slData);
        const lastH = bd.histData[bd.histData.length - 1];
        const lastM = bd.mlData[bd.mlData.length - 1];
        const lastS = bd.slData[bd.slData.length - 1];
        setMacdDisp({ ml: lastM?.value, sl: lastS?.value, hs: lastH?.value });
      }
    } catch(e) {}

    // VCAD sub-chart
    try {
      if (vcadSerRef.current && bd.vcadData.length) vcadSerRef.current.setData(bd.vcadData);
    } catch(e) {}
  }

  // ── EMA cross marker detection ──────────────────────────────────────────────
  function _checkEMACrossMarkers(candles, ema50, ema200) {
    if (!candleRef.current) return;
    const crosses = [];
    for (let i = 1; i < candles.length; i++) {
      if (ema50[i] === null || ema200[i] === null || ema50[i-1] === null || ema200[i-1] === null) continue;
      const wasBelowOrEqual = ema50[i-1] <= ema200[i-1];
      const isAbove         = ema50[i]   >  ema200[i];
      const wasAboveOrEqual = ema50[i-1] >= ema200[i-1];
      const isBelow         = ema50[i]   <  ema200[i];
      if (wasBelowOrEqual && isAbove) crosses.push({ time:candles[i].time, position:'belowBar', color:'#FFD700', shape:'circle', text:'G', size:2 });
      if (wasAboveOrEqual && isBelow) crosses.push({ time:candles[i].time, position:'aboveBar', color:'#FF1744', shape:'circle', text:'D', size:2 });
    }
    // Merge with signal markers — use separate overlay series approach
    // For simplicity, add cross circles as separate line series markers
    // (We'll just log them; full marker merge handled in _renderIndicators L/S path)
  }

  // ── Price line helper ───────────────────────────────────────────────────────
  function _updatePriceLine(price) {
    if (!candleRef.current) return;
    try {
      if (plRef.current) candleRef.current.removePriceLine(plRef.current);
      plRef.current = candleRef.current.createPriceLine({
        price, color:'#10a37f', lineWidth:1, lineStyle:2, axisLabelVisible:true,
      });

  }

  // ── TF switch ─────────────────────────────────────────────────────────────
  useEffect(() => {
    if (!chartRef.current || !candleRef.current) return;
    chartRef.current.applyOptions({ watermark:{ visible:true, fontSize:28, color:'rgba(255,255,255,.06)', horzAlign:'center', vertAlign:'center', text:`XAUUSD · ${TF_LABELS[activeTf]}` }});
    const hist = cacheRef.current[activeTf] || [];

      candleRef.current.setData(hist);
      const live = liveRef.current[activeTf];
      if (live) { try { candleRef.current.update(live); } catch {} }
      const last = live || hist[hist.length - 1];
      _updatePriceLine(last.close);
      setOhlcByTf(p => ({ ...p, [activeTf]: last }));
      // Recalculate indicators for new TF
      const allCandles = live ? [...hist, live] : hist;
      const iData = IndicatorEngine.calculate(allCandles, paramsRef.current);
      indDataRef.current = iData;
      _renderIndicators(allCandles, iData);

  useEffect(() => {

  // ── Re-render when params change ────────────────────────────────────────────
  useEffect(() => {
    const candles = cacheRef.current[activeTfRef.current] || [];
    if (!candles.length || !candleRef.current) return;
    const live = liveRef.current[activeTfRef.current];
    const all  = live ? [...candles, live] : candles;

    _renderIndicators(all, iData);
    try { localStorage.setItem('ind_params', JSON.stringify(indParams)); } catch {}
  }, [indParams]);

  // ── SSE stream ───────────────────────────────────────────────────────────
  useEffect(() => {
    let active = true, reconnTimer = null, es = null;

    function connect() {
      if (!active) return;
      setStreamStatus('reconnecting');
      es = new EventSource('/api/stream/all');
      esRef.current = es;

      es.onopen = () => setStreamStatus('connected');
      es.onerror = () => {
        es.close();
        if (active) reconnTimer = setTimeout(connect, 3000);
      };

      es.onmessage = evt => {
        if (!active) return;
        try { handleMsg(JSON.parse(evt.data)); } catch {}
      };
    }

    function handleMsg(msg) {
      const type = msg.type;

      if (type === 'init') {
        const candles = msg.candles || {};
        TF_LIST.forEach(tf => {
          if (candles[tf] && candles[tf].length) cacheRef.current[tf] = candles[tf];
        });
        const hist = cacheRef.current[activeTfRef.current] || [];
        if (hist.length && candleRef.current) {
          try {
            fibLinesRef.current.forEach(pl => { try { candleRef.current.removePriceLine(pl); } catch {} });
            fibLinesRef.current = [];
            candleRef.current.setMarkers([]);
            candleRef.current.setData(hist);
            const last = hist[hist.length - 1];
            _updatePriceLine(last.close);
            setOhlcByTf(p => ({ ...p, [activeTfRef.current]: last }));
          } catch {}
          // Compute indicators
          const iData = IndicatorEngine.calculate(hist, paramsRef.current);
          indDataRef.current = iData;
          _renderIndicators(hist, iData);
        }
        // Extract day open from M1 candles (first candle of today UTC)
        try {
          const m1 = cacheRef.current['M1'] || [];
          if (m1.length) {
            const todayStart = new Date(); todayStart.setUTCHours(0,0,0,0);
            const todayTs = todayStart.getTime() / 1000;
            const todayCandle = m1.find(c => c.time >= todayTs) || m1[m1.length - 1];
            if (todayCandle) dayOpenRef.current = todayCandle.open;
            const last = cacheRef.current[activeTfRef.current];
            if (last && last.length) {
              const lc = last[last.length - 1];
              const chg = dayOpenRef.current ? lc.close - dayOpenRef.current : 0;
              const chgPct = dayOpenRef.current ? (chg / dayOpenRef.current) * 100 : 0;
              setPriceInfo({ price:lc.close, change:chg, changePct:chgPct, dir: chg > 0 ? 'up' : chg < 0 ? 'dn' : 'flat' });
            }
          }
        } catch {}
        setLoading(false);
      }

      else if (type === 'candle') {
        const { timeframe: tf, candle } = msg;
        if (!tf || !candle) return;
        const cache = cacheRef.current[tf];
        cache.push(candle);
        if (cache.length > 8000) cache.splice(0, cache.length - 8000);
        liveRef.current[tf] = candle;
        if (tf === activeTfRef.current && candleRef.current) {
          try {
            candleRef.current.update({ time:candle.time, open:candle.open, high:candle.high, low:candle.low, close:candle.close });
            _updatePriceLine(candle.close);
            setOhlcByTf(p => ({ ...p, [tf]: candle }));
          } catch {}
          // Full recalculate on candle close
          const all = [...cache, candle];
          const iData = IndicatorEngine.calculate(all, paramsRef.current);
          indDataRef.current = iData;
          _renderIndicators(all, iData);
        }
      }

      else if (type === 'tick') {
        const now = new Date();
        setLastTick(now.toTimeString().slice(0, 8));
        const all = msg.candles || {};
        TF_LIST.forEach(tf => {
          const c = all[tf];
          if (!c) return;
          liveRef.current[tf] = c;
          if (tf === activeTfRef.current && candleRef.current) {
            try {
              candleRef.current.update({ time:c.time, open:c.open, high:c.high, low:c.low, close:c.close });
              _updatePriceLine(c.close);
              setOhlcByTf(p => ({ ...p, [tf]: c }));
            } catch {}
            // Update live price display
            try {
              const chg = dayOpenRef.current ? c.close - dayOpenRef.current : 0;
              const chgPct = dayOpenRef.current ? (chg / dayOpenRef.current) * 100 : 0;
              setPriceInfo({ price:c.close, change:chg, changePct:chgPct, dir: chg > 0 ? 'up' : chg < 0 ? 'dn' : 'flat' });
            } catch {}
            // Update position P&L
            try {
              const pos = posDataRef.current;
              if (pos) {
                const mult = pos.dir === 'long' ? 1 : -1;
                setOpenPnl((c.close - pos.entry) * pos.qty * mult);
                setPosVersion(v => v + 1);
              }
            } catch {}
            // Fast incremental update — only last indicator values
            if (indDataRef.current) _updateLastIndicatorValues(c);
          }
        });
        setStreamStatus('connected');
      }

      else if (type === 'status') {
        setStreamStatus(msg.status || 'disconnected');
      }
    }

    // Fast per-tick update — only recalculate last point
    function _updateLastIndicatorValues(liveCandle) {
      const data = indDataRef.current;
      if (!data) return;
      const cache   = cacheRef.current[activeTfRef.current] || [];
      if (!cache.length) return;
      const closes  = [...cache.map(c => c.close), liveCandle.close];
      const n       = closes.length;

      // EMA last point
      if (togglesRef.current.ema) {
        try {
          const k50  = 2 / (paramsRef.current.emaFast + 1);
          const k200 = 2 / (paramsRef.current.emaSlow + 1);
          const prev50  = data.ema50[data.ema50.length - 1];
          const prev200 = data.ema200[data.ema200.length - 1];
          if (prev50  !== null) { const v = liveCandle.close * k50  + prev50  * (1 - k50);  try { ema50Ref.current  && ema50Ref.current.update({ time:liveCandle.time, value:v }); } catch {} }
          if (prev200 !== null) { const v = liveCandle.close * k200 + prev200 * (1 - k200); try { ema200Ref.current && ema200Ref.current.update({ time:liveCandle.time, value:v }); } catch {} }
        } catch {}
      }

      // VWAP last point
      if (togglesRef.current.vwap) {
        try {
          const lastV = data.vwap.vwap[data.vwap.vwap.length - 1];
          if (lastV !== null) { try { vwapRef.current && vwapRef.current.update({ time:liveCandle.time, value:lastV }); } catch {} }
        } catch {}
      }

      // RSI last point (Wilder's incremental)
      try {
        const rsiArr = data.rsi;
        const period = paramsRef.current.rsiPeriod;
        const lastRsi = rsiArr[rsiArr.length - 1];
        if (lastRsi !== null && cache.length >= period + 1) {
          const prevClose = cache[cache.length - 1].close;
          const diff = liveCandle.close - prevClose;
          // approximate: use last known avg gain/loss as proxy
          const oldRSI = lastRsi / 100;
          const approxAG = (100 - lastRsi) > 0 ? (lastRsi / (100 - lastRsi)) : 100;
          const gain = Math.max(diff, 0), loss = Math.max(-diff, 0);
          const newAG = (approxAG * (period - 1) + gain) / period;
          const newAL = (approxAG > 0 ? (newAG / (oldRSI)) * (1 - oldRSI) : 0) * (period - 1 + loss) / period;
          const newRsi = 100 - 100 / (1 + (newAL > 0 ? newAG / newAL : 100));
          if (rsiSerRef.current && !isNaN(newRsi)) {
            try { rsiSerRef.current.update({ time:liveCandle.time, value:Math.max(0, Math.min(100, newRsi)) }); } catch {}
            setRsiDisp(Math.max(0, Math.min(100, newRsi)));
          }
        }
      } catch {}

      // MACD last point (fast approximation)
      try {
        if (macdHistRef.current && data.macd.histogram.length > 0) {
          const lastH = data.macd.histogram[data.macd.histogram.length - 1];
          const prev  = data.macd.histogram[data.macd.histogram.length - 2];
          if (lastH !== null) {
            const color = lastH >= 0
              ? (prev === null || lastH >= prev ? '#26a69a' : 'rgba(38,166,154,.5)')
              : (prev === null || lastH <= prev ? '#ef5350' : 'rgba(239,83,80,.5)');
            try { macdHistRef.current.update({ time:liveCandle.time, value:lastH, color }); } catch {}
            const lastM = data.macd.macdLine[data.macd.macdLine.length - 1];
            const lastS = data.macd.signalLine[data.macd.signalLine.length - 1];
            if (lastM !== null) { try { macdLineRef.current && macdLineRef.current.update({ time:liveCandle.time, value:lastM }); } catch {} }
            if (lastS !== null) { try { macdSigRef.current  && macdSigRef.current.update({ time:liveCandle.time, value:lastS });  } catch {} }
            setMacdDisp({ ml:lastM, sl:lastS, hs:lastH });
          }
        }
      } catch {}
    }

    connect();
    return () => {
      active = false;
      clearTimeout(reconnTimer);
      if (esRef.current) { esRef.current.close(); esRef.current = null; }
    };
  }, []);

  // ── Render ─────────────────────────────────────────────────────────────────
  function fmtP(v) { return v != null ? Number(v).toFixed(2) : '—'; }
  function fmtI(v) { return v != null ? Number(v).toFixed(1) : '—'; }

  const currOhlc    = ohlcByTf[activeTf];
  const statusLabel = streamStatus === 'connected' ? 'LIVE'
    : streamStatus === 'reconnecting' ? 'Sync…' : 'Offline';

  function toggleInd(key) {
    setIndicators(prev => {
      const next = { ...prev, [key]: !prev[key] };
      try { localStorage.setItem('ind_toggles', JSON.stringify(next)); } catch {}
      return next;
    });
  }

  function handleParamChange(key, val) {
    const n = parseInt(val, 10);
    if (isNaN(n) || n < 1) return;
    setIndParams(prev => {
      const next = { ...prev, [key]: n };
      try { localStorage.setItem('ind_params', JSON.stringify(next)); } catch {}
      return next;
    });
  }

  const rsiColor = rsiDisp === null ? 'var(--muted)' : rsiDisp > 70 ? '#ef5350' : rsiDisp < 30 ? '#26a69a' : 'var(--text)';

  return (
    <div style={{ display:'flex', flexDirection:'column', background:'#131722', height:'calc(100vh - 52px)', overflow:'hidden' }}>

      {/* ── Symbol Info Bar ── */}
      <div className="tv-symbar">
        <span className="tv-sym-name">XAU/USD</span>
        <span className="tv-sym-ex">OANDA · GOLD</span>
        {priceInfo.price !== null && (
          <>
            <span className="tv-price">{fmtP(priceInfo.price)}</span>
            <span className={`tv-change ${priceInfo.dir}`}>
              {priceInfo.dir === 'up' ? '▲' : priceInfo.dir === 'dn' ? '▼' : '●'}
              {' '}{priceInfo.change >= 0 ? '+' : ''}{fmtP(priceInfo.change)}
              {' '}({priceInfo.changePct >= 0 ? '+' : ''}{fmt(priceInfo.changePct, 2)}%)
            </span>
          </>
        )}
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:8 }}>
          <div className="tv-live-wrap">
            <span className={`tv-live-dot ${streamStatus}`} />
            <span className="tv-live-lbl">{statusLabel}</span>
            {lastTick && <span style={{ fontSize:10, color:'#555', marginLeft:4, fontFamily:'monospace' }}>{lastTick}</span>}
          </div>
        </div>
      </div>

      {/* ── Professional Toolbar ── */}
      <div className="tv-tbar">
        {TF_LIST.map(tf => (
          <button key={tf} className={`tv-tf-btn${activeTf === tf ? ' active' : ''}`} onClick={() => setActiveTf(tf)}>
            {TF_LABELS[tf]}
          </button>
        ))}
        <div className="tv-sep" />
        <button className={`tv-ind-btn${indicators.rsi  ? ' on' : ''}`}  onClick={() => toggleInd('rsi')}>
          <IcoRSI />RSI
        </button>
        <button className={`tv-ind-btn${indicators.ema  ? ' on' : ''}`}  onClick={() => toggleInd('ema')}>
          <IcoEMA />EMA
        </button>
        <button className={`tv-ind-btn${indicators.fib  ? ' on-r' : ''}`} onClick={() => toggleInd('fib')}>
          <IcoFIB />FIB
        </button>
        <button className={`tv-ind-btn${indicators.macd ? ' on' : ''}`}  onClick={() => toggleInd('macd')}>
          <IcoMACD />MACD
        </button>
        <button className={`tv-ind-btn${indicators.vwap ? ' on-g' : ''}`} onClick={() => toggleInd('vwap')}>
          <IcoVWAP />VWAP
        </button>
        <button className={`tv-ind-btn${indicators.vcad ? ' on' : ''}`}  onClick={() => toggleInd('vcad')}>
          <IcoVCAD />VCAD
        </button>
        {currOhlc && (
          <div className="tv-ohlc">
            <span className="tv-ohlc-item"><span className="tv-ohlc-lbl">O</span><span className="tv-ohlc-val">{fmtP(currOhlc.open)}</span></span>
            <span className="tv-ohlc-item"><span className="tv-ohlc-lbl" style={{color:'#26a69a'}}>H</span><span className="tv-ohlc-val" style={{color:'#26a69a'}}>{fmtP(currOhlc.high)}</span></span>
            <span className="tv-ohlc-item"><span className="tv-ohlc-lbl" style={{color:'#ef5350'}}>L</span><span className="tv-ohlc-val" style={{color:'#ef5350'}}>{fmtP(currOhlc.low)}</span></span>
            <span className="tv-ohlc-item"><span className="tv-ohlc-lbl">C</span><span className="tv-ohlc-val">{fmtP(currOhlc.close)}</span></span>
          </div>
        )}
        <div className="tv-sep" />
        <button
          className={`tv-pos-btn long${position?.dir === 'long' ? ' on' : ''}`}
          title="Long Position Tool"
          onClick={() => openPositionTool('long')}
        >
          <IcoPos />Long
        </button>
        <button
          className={`tv-pos-btn short${position?.dir === 'short' ? ' on' : ''}`}
          title="Short Position Tool"
          onClick={() => openPositionTool('short')}
        >
          <IcoPos />Short
        </button>
        <div className="tv-sep" />
        <button className="tv-gear" title="Indicator Settings" onClick={() => setShowSettings(true)}>
          <IcoGear />
        </button>
      </div>

      {/* ── Main Chart ── */}
      <div className="tv-chart-wrap">
        {loading && (
          <div className="tv-overlay">
            <div className="spin" style={{ width:28, height:28, borderWidth:3 }} />
            <span className="tv-overlay-msg">Loading 5-day history…</span>
          </div>
        )}
        {error && !loading && <div className="tv-err-msg">{error}</div>}
        <div ref={containerRef} style={{ width:'100%', height:'100%' }} />

        {/* ── Position Overlay ── */}
        {position && (() => {
          const ser = candleRef.current;
          if (!ser) return null;
          const rawTpY = ser.priceToCoordinate(position.tp);
          const rawSlY = ser.priceToCoordinate(position.sl);
          const rawEnY = ser.priceToCoordinate(position.entry);
          // Bail only if entry is off-screen; TP/SL are clamped to edges
          if (rawEnY == null) return null;

          // Use getBoundingClientRect for reliable height in flex layouts
          const H = containerRef.current?.offsetHeight || containerRef.current?.clientHeight || 600;
          const clamp = y => Math.max(0, Math.min(H, y));
          const enY = clamp(rawEnY);
          // If TP/SL off-screen, pin to top or bottom edge based on price vs entry
          const tpY = rawTpY != null ? clamp(rawTpY) : (position.tp > position.entry ? 0 : H);
          const slY = rawSlY != null ? clamp(rawSlY) : (position.sl > position.entry ? 0 : H);

          const isLong = position.dir === 'long';
          const mult   = isLong ? 1 : -1;

          // ── Direction-based zone colors ───────────────────────────────────────
          // LONG:  zone ABOVE entry → GREEN (profit going up)
          //        zone BELOW entry → RED   (loss going down)
          // SHORT: zone ABOVE entry → RED   (loss if price rises)
          //        zone BELOW entry → GREEN (profit if price falls)
          const tpAbove     = tpY < enY;   // smaller Y = higher on screen = higher price
          const slAbove     = slY < enY;
          const tpIsProfit  = isLong ? tpAbove  : !tpAbove;
          const slIsProfit  = isLong ? !slAbove :  slAbove;
          const tpZoneClass = tpIsProfit ? 'tv-pos-profit' : 'tv-pos-loss';
          const slZoneClass = slIsProfit ? 'tv-pos-profit' : 'tv-pos-loss';
          const tpLineColor = tpIsProfit ? '#26a69a' : '#ef5350';
          const slLineColor = slIsProfit ? '#26a69a' : '#ef5350';
          const tpTagStyle  = tpIsProfit
            ? { background:'rgba(38,166,154,.92)', border:'1px solid #26a69a', color:'#fff' }
            : { background:'rgba(239,83,80,.92)',  border:'1px solid #ef5350', color:'#fff' };
          const slTagStyle  = slIsProfit
            ? { background:'rgba(38,166,154,.92)', border:'1px solid #26a69a', color:'#fff' }
            : { background:'rgba(239,83,80,.92)',  border:'1px solid #ef5350', color:'#fff' };

          // ── Zone bounds — bounded strictly between entry↔TP and entry↔SL ────
          // maxZoneH: neither zone can exceed the full TP-to-SL span
          const fullSpanH   = Math.abs(tpY - slY);
          const tpZoneTop   = Math.min(tpY, enY);
          const tpZoneH     = Math.min(Math.max(Math.abs(tpY - enY), 3), fullSpanH);
          const slZoneTop   = Math.min(slY, enY);
          const slZoneH     = Math.min(Math.max(Math.abs(slY - enY), 3), fullSpanH);

          // ── Calculations ─────────────────────────────────────────────────────
          const tpPct = (position.tp - position.entry) / position.entry * 100 * mult;
          const slPct = (position.entry - position.sl) / position.entry * 100 * mult;
          const tpAmt = Math.abs((position.tp - position.entry) * position.qty);
          const slAmt = Math.abs((position.entry - position.sl) * position.qty);
          const rr    = slAmt > 0 ? (tpAmt / slAmt).toFixed(2) : '∞';
          const pnlPos = openPnl >= 0;

          // P&L info box: midpoint between outer lines, clamped to stay visible
          const outerTop = Math.min(tpY, slY);
          const outerBot = Math.max(tpY, slY);
          const infoY = Math.max(44, Math.min((outerTop + outerBot) / 2, H - 44));
          const infoX = containerRef.current ? Math.round(containerRef.current.offsetWidth * 0.42) : 200;

          return (
            <div className="tv-pos-overlay">

              {/* TP zone — green for profit side, red for loss side (direction-aware) */}
              <div className={`tv-pos-zone ${tpZoneClass}`}
                style={{ top:tpZoneTop, height:tpZoneH }} />

              {/* SL zone — red for loss side, green for profit side (direction-aware) */}
              <div className={`tv-pos-zone ${slZoneClass}`}
                style={{ top:slZoneTop, height:slZoneH }} />

              {/* TP line + drag handle + compact tag */}
              <div className="tv-pos-row" style={{ top:tpY, borderTop:`1.5px solid ${tpLineColor}` }}>
                <div className="tv-pos-hit" onMouseDown={e => startDrag(e,'tp')} />
                <div className="tv-pos-knob" style={{ borderColor:tpLineColor }} onMouseDown={e => startDrag(e,'tp')} />
                <div className="tv-pos-tag" style={tpTagStyle} onMouseDown={e => startDrag(e,'tp')}>
                  <span className="tv-pos-tag-b">Target: {position.tp.toFixed(2)}</span>
                  <span className="tv-pos-tag-s">{tpPct>=0?'+':''}{tpPct.toFixed(3)}%&nbsp;·&nbsp;+${tpAmt.toFixed(2)}</span>
                </div>
              </div>

              {/* Entry line + drag handle + compact tag */}
              <div className="tv-pos-row" style={{ top:enY, borderTop:'1px dashed rgba(33,150,243,.85)' }}>
                <div className="tv-pos-hit" onMouseDown={e => startDrag(e,'entry')} />
                <div className="tv-pos-knob" style={{ borderColor:'#2196F3' }} onMouseDown={e => startDrag(e,'entry')} />
                <div className="tv-pos-tag tv-pos-tag-en" onMouseDown={e => startDrag(e,'entry')}>
                  <span className="tv-pos-tag-b">Entry: {position.entry.toFixed(2)}</span>
                  <span className="tv-pos-tag-s">{isLong?'▲ LONG':'▼ SHORT'}&nbsp;·&nbsp;Qty:{position.qty}</span>
                </div>
              </div>

              {/* SL line + drag handle + compact tag */}
              <div className="tv-pos-row" style={{ top:slY, borderTop:`1.5px solid ${slLineColor}` }}>
                <div className="tv-pos-hit" onMouseDown={e => startDrag(e,'sl')} />
                <div className="tv-pos-knob" style={{ borderColor:slLineColor }} onMouseDown={e => startDrag(e,'sl')} />
                <div className="tv-pos-tag" style={slTagStyle} onMouseDown={e => startDrag(e,'sl')}>
                  <span className="tv-pos-tag-b">Stop: {position.sl.toFixed(2)}</span>
                  <span className="tv-pos-tag-s">{(-Math.abs(slPct)).toFixed(3)}%&nbsp;·&nbsp;-${slAmt.toFixed(2)}</span>
                </div>
              </div>

              {/* Compact floating P&L box */}
              <div className="tv-pos-info" style={{ top:infoY, left:infoX }}>
                <div className={`tv-pos-info-pnl ${pnlPos?'tv-pos-pnl-pos':'tv-pos-pnl-neg'}`}>
                  Open P&amp;L: {pnlPos?'+':''}{openPnl.toFixed(2)}
                </div>
                <div className="tv-pos-info-row">
                  <span>Qty:{position.qty}</span>
                  <span>R/R:{rr}</span>
                  <span style={{color:isLong?'#26a69a':'#ef5350',fontWeight:700}}>{isLong?'▲L':'▼S'}</span>
                </div>
                <button className="tv-pos-x" onClick={() => setPosition(null)}>✕</button>
              </div>

            </div>
          );
        })()}

      </div>

      {/* ── RSI Sub-pane ── */}
      <div className="tv-pane" style={{ height: indicators.rsi ? 110 : 0 }}>
        <div className="tv-pane-lbl">
          <span>RSI({indParams.rsiPeriod})</span>
          {rsiDisp !== null && <span className="tv-pane-val" style={{ color: rsiColor }}>{fmtI(rsiDisp)}</span>}
        </div>
        <div ref={rsiContainerRef} style={{ width:'100%', height:110 }} />
      </div>

      {/* ── MACD Sub-pane ── */}
      <div className="tv-pane" style={{ height: indicators.macd ? 110 : 0 }}>
        <div className="tv-pane-lbl">
          <span>MACD({indParams.macdFast},{indParams.macdSlow},{indParams.macdSignal})</span>
          {macdDisp.ml !== null && <span className="tv-pane-val tv-pane-macd">{fmt(macdDisp.ml, 3)}</span>}
          {macdDisp.sl !== null && <span className="tv-pane-val tv-pane-sig">{fmt(macdDisp.sl, 3)}</span>}
          {macdDisp.hs !== null && <span className="tv-pane-val tv-pane-hist" style={{ color: macdDisp.hs >= 0 ? '#26a69a' : '#ef5350' }}>{fmt(macdDisp.hs, 3)}</span>}
        </div>
        <div ref={macdContainerRef} style={{ width:'100%', height:110 }} />
      </div>

      {/* ── VCAD Sub-pane ── */}
      <div className="tv-pane" style={{ height: indicators.vcad ? 80 : 0 }}>
        <div className="tv-pane-lbl"><span>VCAD A/D</span></div>
        <div ref={vcadContainerRef} style={{ width:'100%', height:80 }} />
      </div>



      {/* ── Position Modal ── */}
      {showPosModal && (() => {
        const ep  = parseFloat(posForm.entry)||0;
        const tp  = parseFloat(posForm.tp)||0;
        const sl  = parseFloat(posForm.sl)||0;
        const qty = parseFloat(posForm.qty)||1;
        const isL = posForm.dir === 'long';
        const mult = isL ? 1 : -1;
        const tpPct = ep ? (tp-ep)/ep*100*mult : 0;
        const slPct = ep ? (ep-sl)/ep*100*mult : 0;
        const tpAmt = ep&&tp ? Math.abs((tp-ep)*qty) : 0;
        const slAmt = ep&&sl ? Math.abs((ep-sl)*qty) : 0;
        const rr    = slAmt>0 ? (tpAmt/slAmt).toFixed(2) : '—';
        function savePos(){
          if(!ep||!tp||!sl) return;
          setPosition({
            dir:posForm.dir,
            entry:ep,
            tp,
            sl,
            qty,
            anchorTime: posForm.anchorTime ?? getActiveAnchorTime(),
          });
          setOpenPnl(0);
          setShowPosModal(false);
        }
        return (
          <div className="tv-pos-mwrap" onClick={e=>{if(e.target===e.currentTarget)setShowPosModal(false);}}>
            <div className="tv-pos-mdl">
              <div className="tv-pos-mdl-hd">
                <span className="tv-pos-mdl-ttl">{isL ? 'Long Position Tool' : 'Short Position Tool'}</span>
                <button className="tv-pos-mdl-cls" onClick={()=>setShowPosModal(false)}>✕</button>
              </div>
              <div className={`tv-pos-kind ${isL ? 'long' : 'short'}`}>{isL ? '▲ LONG POSITION' : '▼ SHORT POSITION'}</div>
              <div className="tv-pos-fld">
                <label className="tv-pos-fld-lbl">Entry Price</label>
                <input className="tv-pos-inp" type="number" step="0.01" value={posForm.entry} onChange={e=>setPosForm(p=>({...p,entry:e.target.value}))} />
              </div>
              <div className="tv-pos-g2">
                <div className="tv-pos-fld">
                  <label className="tv-pos-fld-lbl" style={{color:'#26a69a'}}>Take Profit</label>
                  <input className="tv-pos-inp" type="number" step="0.01" value={posForm.tp} onChange={e=>setPosForm(p=>({...p,tp:e.target.value}))} />
                </div>
                <div className="tv-pos-fld">
                  <label className="tv-pos-fld-lbl" style={{color:'#ef5350'}}>Stop Loss</label>
                  <input className="tv-pos-inp" type="number" step="0.01" value={posForm.sl} onChange={e=>setPosForm(p=>({...p,sl:e.target.value}))} />
                </div>
              </div>
              <div className="tv-pos-fld">
                <label className="tv-pos-fld-lbl">Quantity (oz)</label>
                <input className="tv-pos-inp" type="number" step="0.01" min="0.01" value={posForm.qty} onChange={e=>setPosForm(p=>({...p,qty:e.target.value}))} />
              </div>
              <div className="tv-pos-sts">

                <div className="tv-pos-st"><div className="tv-pos-stl">SL Distance</div><div className="tv-pos-stv r">-{Math.abs(slPct).toFixed(3)}%</div></div>

/* ── Live Signals Panel ─────────────────────────────────────────────────── */
function LiveSignalsPanel() {
  const [signals,   setSignals]   = useState([]);
  const [loading,   setLoading]   = useState(true);
  const [filter,    setFilter]    = useState('ALL');   // ALL | BUY | SELL | WIN | LOSS | PENDING
  const [marking,   setMarking]   = useState(null);   // signal _id being marked
  const [markData,  setMarkData]  = useState({});     // {id: {outcome, exitPrice}}

  const load = useCallback(async () => {
    try {
      const r = await fetch('/signals?limit=100');
      const d = await r.json();
      setSignals(d.signals || []);
    } catch {}
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  // auto-refresh every 30s
  useEffect(() => {
    const id = setInterval(load, 30000);
    return () => clearInterval(id);
  }, [load]);

  async function handleMark(sig) {
    const md = markData[sig._id] || {};
    const outcome = md.outcome || 'WIN';
    const exitPrice = md.exitPrice ? parseFloat(md.exitPrice) : null;
    setMarking(sig._id);
    try {
      const r = await fetch(`/signals/${sig._id}/outcome`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ outcome, exit_price: exitPrice }),
      });
      if (r.ok) {
        setSignals(prev => prev.map(s =>
          s._id === sig._id ? { ...s, outcome, exit_price: exitPrice } : s
        ));
      }
    } catch {}
    setMarking(null);
  }

  function fmtTime(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
  }

  function fmtPrice(v) {
    if (v == null) return '-';
    return Number(v).toFixed(2);
  }

  const filtered = signals.filter(s => {
    if (filter === 'ALL')     return true;
    if (filter === 'BUY')     return s.direction === 'BUY';
    if (filter === 'SELL')    return s.direction === 'SELL';
    if (filter === 'WIN')     return s.outcome === 'WIN';
    if (filter === 'LOSS')    return s.outcome === 'LOSS';
    if (filter === 'PENDING') return !s.outcome;
    return true;
  });

  const counts = {
    ALL: signals.length,
    BUY: signals.filter(s => s.direction === 'BUY').length,
    SELL: signals.filter(s => s.direction === 'SELL').length,
    WIN: signals.filter(s => s.outcome === 'WIN').length,
    LOSS: signals.filter(s => s.outcome === 'LOSS').length,
    PENDING: signals.filter(s => !s.outcome).length,
  };

  const winCount  = counts.WIN;
  const lossCount = counts.LOSS;
  const closedTotal = winCount + lossCount;
  const liveWR = closedTotal > 0 ? ((winCount / closedTotal) * 100).toFixed(1) : null;

  return (
    <div className="card">
      <div className="sig-toolbar">
        <span className="sig-toolbar-title">
          Live Signals
          {liveWR !== null && (
            <span style={{ marginLeft: 10, fontWeight: 400, color: 'var(--muted)', fontSize: 12 }}>
              {winCount}W / {lossCount}L &nbsp;·&nbsp;
              <span style={{ color: parseFloat(liveWR) >= 50 ? 'var(--win)' : 'var(--loss)', fontWeight: 700 }}>
                {liveWR}% WR
              </span>
            </span>
          )}
        </span>
        {['ALL','BUY','SELL','WIN','LOSS','PENDING'].map(f => (
          <button key={f}
            className={`sig-filter-btn${filter === f ? ' active' : ''}`}
            onClick={() => setFilter(f)}>
            {f} {counts[f] > 0 ? `(${counts[f]})` : ''}
          </button>
        ))}
        <button className="sig-filter-btn" onClick={load} title="Refresh">&#8635;</button>
      </div>

      {loading ? (
        <div className="sig-empty">Loading signals…</div>
      ) : filtered.length === 0 ? (
        <div className="sig-empty">
          {signals.length === 0
            ? 'No signals yet — signals appear here once the bot generates a trade entry.'
            : `No signals match filter "${filter}".`}
        </div>
      ) : (
        <div style={{ overflowX: 'auto' }}>
          <table className="sig-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Time (UTC)</th>
                <th>Dir</th>
                <th>Entry</th>
                <th>SL</th>
                <th>TP</th>
                <th>ATR</th>
                <th>Score</th>
                <th>Session</th>
                <th>Regime</th>
                <th>TG</th>
                <th>Outcome</th>
                <th>Exit</th>
                <th>Mark</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((s, i) => {
                const md = markData[s._id] || {};
                const isBusy = marking === s._id;
                return (
                  <tr key={s._id}>
                    <td style={{ color: 'var(--muted)' }}>{signals.length - signals.indexOf(s)}</td>
                    <td style={{ whiteSpace: 'nowrap', color: 'var(--muted)', fontSize: 11 }}>{fmtTime(s.sent_at)}</td>
                    <td className={s.direction === 'BUY' ? 'sig-dir-buy' : 'sig-dir-sell'}>{s.direction}</td>
                    <td><strong>{fmtPrice(s.entry_price)}</strong></td>
                    <td style={{ color: 'var(--loss)' }}>{fmtPrice(s.stop_loss)}</td>
                    <td style={{ color: 'var(--win)' }}>{fmtPrice(s.take_profit)}</td>
                    <td style={{ color: 'var(--muted)' }}>{fmtPrice(s.atr)}</td>
                    <td>{s.score}/{s.score_threshold}</td>
                    <td><span className="badge badge-gray" style={{ fontSize: 10 }}>{s.session}</span></td>
                    <td style={{ color: 'var(--muted)', fontSize: 11 }}>{s.market_regime}</td>
                    <td>
                      {s.telegram_sent
                        ? <span className="sig-tg-sent" title="Telegram sent">&#10003;</span>
                        : <span className="sig-tg-fail" title="Not sent">&#8212;</span>}
                    </td>
                    <td>
                      {s.outcome === 'WIN'  && <span className="sig-outcome-win">WIN</span>}
                      {s.outcome === 'LOSS' && <span className="sig-outcome-loss">LOSS</span>}
                      {s.outcome === 'BREAKEVEN' && <span className="sig-outcome-be">BE</span>}
                      {!s.outcome && <span className="sig-outcome-none">Pending</span>}
                    </td>
                    <td style={{ color: 'var(--muted)' }}>{fmtPrice(s.exit_price)}</td>
                    <td>
                      {!s.outcome && (
                        <div style={{ display: 'flex', gap: 4, alignItems: 'center', flexWrap: 'wrap' }}>
                          <select
                            style={{ fontSize: 10, background: 'var(--bg)', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: 4, padding: '2px 4px' }}
                            value={md.outcome || 'WIN'}
                            onChange={e => setMarkData(prev => ({ ...prev, [s._id]: { ...md, outcome: e.target.value } }))}>
                            <option>WIN</option>
                            <option>LOSS</option>
                            <option>BREAKEVEN</option>
                          </select>
                          <input
                            type="number"
                            placeholder="Exit $"
                            style={{ width: 70, fontSize: 10, background: 'var(--bg)', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: 4, padding: '2px 5px' }}
                            value={md.exitPrice || ''}
                            onChange={e => setMarkData(prev => ({ ...prev, [s._id]: { ...md, exitPrice: e.target.value } }))}
                          />
                          <button className="sig-mark-btn" onClick={() => handleMark(s)} disabled={isBusy}>
                            {isBusy ? '…' : 'Save'}
                          </button>
                        </div>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────────────────
   XAU Scalp — Backtest Panel
───────────────────────────────────────────────────────────────────────────── */
function XauBacktestPanel() {
  const today     = new Date().toISOString().slice(0, 10);
  const monthAgo  = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);

  const [startDate,  setStartDate]  = useState(monthAgo);
  const [endDate,    setEndDate]    = useState(today);
  const [balance,    setBalance]    = useState(10000);
  const [riskPct,    setRiskPct]    = useState(1.0);
  const [maxHold,    setMaxHold]    = useState(200);
  const [loading,    setLoading]    = useState(false);
  const [result,     setResult]     = useState(() => {
    try { const s = localStorage.getItem('strategy:xau-scalp:backtest'); return s ? JSON.parse(s) : null; } catch { return null; }
  });
  const [error, setError] = useState('');

  async function runBacktest() {
    setLoading(true); setError('');
    try {
      const r = await fetch('/api/xau-scalp/backtest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ start_date: startDate, end_date: endDate, starting_balance: balance, risk_per_trade_pct: riskPct, max_hold_bars: maxHold }),
      });
      const d = await r.json();
      if (d.error) { setError(d.error); return; }
      setResult(d);
      try { localStorage.setItem('strategy:xau-scalp:backtest', JSON.stringify(d)); } catch {}
    } catch (e) {
      setError('Network error — is the server running?');
    } finally {
      setLoading(false);
    }
  }

  const m   = result?.metrics || {};
  const pnlPos = (m.totalPnl ?? 0) >= 0;

  // ── SVG equity curve ──────────────────────────────────────────────────────
  function EquityCurve({ curve }) {
    if (!curve || curve.length < 2) return <div className="chart-empty">Run a backtest to see the equity curve</div>;
    const W = 800, H = 120, PAD = 10;
    const vals  = curve.map(p => p.equity);
    const minV  = Math.min(...vals);
    const maxV  = Math.max(...vals);
    const range = maxV - minV || 1;
    const pts   = curve.map((p, i) => {
      const x = PAD + (i / (curve.length - 1)) * (W - PAD * 2);
      const y = H - PAD - ((p.equity - minV) / range) * (H - PAD * 2);
      return `${x},${y}`;
    }).join(' ');
    const color = vals[vals.length - 1] >= vals[0] ? '#10a37f' : '#ef4444';
    return (
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{ height: 120 }}>
        <polyline points={pts} fill="none" stroke={color} strokeWidth="2" />
        <line x1={PAD} y1={H - PAD} x2={W - PAD} y2={H - PAD} stroke="rgba(255,255,255,.1)" strokeWidth="1" />
      </svg>
    );
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>

      {/* ── Settings Card ── */}
      <div className="card">
        <div className="card-hd">
          <span className="card-title">Backtest · XAU SCALP · M1</span>
          {result && (
            <button className="btn btn-ghost btn-sm" onClick={() => { setResult(null); try { localStorage.removeItem('strategy:xau-scalp:backtest'); } catch {} }}>
              Clear
            </button>
          )}
        </div>
        <div className="card-body">
          <div className="form-grid">
            <div className="fg">
              <label className="fg-label">Start Date</label>
              <input className="input" type="date" value={startDate} onChange={e => setStartDate(e.target.value)} />
            </div>
            <div className="fg">
              <label className="fg-label">End Date</label>
              <input className="input" type="date" value={endDate} onChange={e => setEndDate(e.target.value)} />
            </div>
            <div className="fg">
              <label className="fg-label">Starting Balance ($)</label>
              <input className="input" type="number" value={balance} onChange={e => setBalance(+e.target.value)} min="1000" />
            </div>
            <div className="fg">
              <label className="fg-label">Risk Per Trade <span className="fg-accent">{riskPct}%</span></label>
              <div className="slider-row">
                <input type="range" min="0.5" max="5" step="0.5" value={riskPct} onChange={e => setRiskPct(+e.target.value)} style={{ flex: 1 }} />
                <span className="slider-val">{riskPct}%</span>
              </div>
            </div>
            <div className="fg">
              <label className="fg-label">Max Hold Bars (M1) <span className="fg-accent">{maxHold}</span></label>
              <div className="slider-row">
                <input type="range" min="50" max="500" step="50" value={maxHold} onChange={e => setMaxHold(+e.target.value)} style={{ flex: 1 }} />
                <span className="slider-val">{maxHold}</span>
              </div>
            </div>
          </div>
          {error && <div style={{ color: 'var(--loss)', fontSize: 12, marginBottom: 12 }}>{error}</div>}
          <button className="btn btn-primary" onClick={runBacktest} disabled={loading} style={{ width: '100%' }}>
            {loading ? <><span className="spin" /> Running XAU backtest…</> : '▶  Run XAU Scalp Backtest'}
          </button>
        </div>
      </div>

      {/* ── Results ── */}
      {result && !result.error && (
        <>
          {/* Metrics */}
          <div className="card">
            <div className="card-hd">
              <span className="card-title">Results — {m.startDate} → {m.endDate}</span>
              <span className="badge badge-gray">{m.totalCandles?.toLocaleString()} M1 candles</span>
            </div>
            <div className="card-body">
              <div className="xau-bt-grid">
                <div className="xau-bt-mc"><div className="xau-bt-mc-lbl">Total Trades</div><div className="xau-bt-mc-val">{m.totalTrades ?? '—'}</div></div>
                <div className="xau-bt-mc"><div className="xau-bt-mc-lbl">Win Rate</div><div className={`xau-bt-mc-val ${(m.winRate??0)>=50?'g':'r'}`}>{m.winRate ?? '—'}%</div></div>
                <div className="xau-bt-mc"><div className="xau-bt-mc-lbl">Wins / Losses</div><div className="xau-bt-mc-val"><span style={{color:'var(--win)'}}>{m.wins??0}</span> / <span style={{color:'var(--loss)'}}>{m.losses??0}</span></div></div>
                <div className="xau-bt-mc"><div className="xau-bt-mc-lbl">Timeouts</div><div className="xau-bt-mc-val a">{m.timeouts??0}</div></div>
                <div className="xau-bt-mc"><div className="xau-bt-mc-lbl">Total P&L</div><div className={`xau-bt-mc-val ${pnlPos?'g':'r'}`}>{pnlPos?'+':''}{m.totalPnl?.toFixed(2)}</div></div>
                <div className="xau-bt-mc"><div className="xau-bt-mc-lbl">Return</div><div className={`xau-bt-mc-val ${pnlPos?'g':'r'}`}>{pnlPos?'+':''}{m.totalPnlPct?.toFixed(2)}%</div></div>
                <div className="xau-bt-mc"><div className="xau-bt-mc-lbl">Avg R:R</div><div className="xau-bt-mc-val a">1:{m.avgRR?.toFixed(2)}</div></div>
                <div className="xau-bt-mc"><div className="xau-bt-mc-lbl">Profit Factor</div><div className={`xau-bt-mc-val ${(m.profitFactor??0)>=1?'g':'r'}`}>{m.profitFactor ?? '∞'}</div></div>
              </div>

              {/* Equity curve */}
              <div className="xau-equity-wrap">
                <EquityCurve curve={result.equity_curve} />
              </div>
            </div>
          </div>

          {/* Trade table */}
          {result.trades?.length > 0 && (
            <div className="card">
              <div className="card-hd">
                <span className="card-title">Trade Log</span>
                <span className="badge badge-gray">{result.trades.length} trades</span>
              </div>
              <div className="tbl-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>#</th><th>Time</th><th>Entry</th>
                      <th>SL</th><th>TP</th><th>R:R</th>
                      <th>Score</th><th>Strength</th><th>Outcome</th><th>P&amp;L</th>
                    </tr>
                  </thead>
                  <tbody>
                    {result.trades.map((t, i) => {
                      const oc = t.outcome === 'WIN' ? 'badge-green' : t.outcome === 'LOSS' ? 'badge-red' : 'badge-gray';
                      const sc = t.strength === 'STRONG' ? 'badge-green' : 'badge-gray';
                      return (
                        <tr key={i}>
                          <td className="td-muted">{i + 1}</td>
                          <td className="td-mono td-muted">{t.entry_timestamp?.slice(0, 16)}</td>
                          <td className="td-mono">{t.entry?.toFixed(2)}</td>
                          <td className="td-loss">{t.stop_loss?.toFixed(2)}</td>
                          <td className="td-win">{t.take_profit?.toFixed(2)}</td>
                          <td className="td-mono">1:{t.risk_reward?.toFixed(2)}</td>
                          <td className="td-mono">{t.score}/5</td>
                          <td><span className={`badge ${sc}`}>{t.strength}</span></td>
                          <td><span className={`badge ${oc}`}>{t.outcome}</span></td>
                          <td className={t.pnl >= 0 ? 'td-win' : 'td-loss'}>{t.pnl >= 0 ? '+' : ''}{t.pnl?.toFixed(2)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}
